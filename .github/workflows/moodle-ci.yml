name: Moodle Plugin CI

on:
  push:
    branches:
      - main
      - 'MOODLE_*'
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-22.04

    env:
      TZ: Australia/Sydney

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        moodle-branch: ['MOODLE_500_STABLE', 'MOODLE_501_STABLE']
        database: [mysqli, pgsql]
        # Moodle 5.2 excluded: branch not yet stable at time of writing.

    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pgsql, mysqli, zip, gd
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist \
            moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci && pwd)/bin" >> $GITHUB_PATH
          echo "$(cd ci && pwd)/vendor/bin" >> $GITHUB_PATH

      - name: Install Moodle
        run: |
          moodle-plugin-ci install \
            --plugin ./plugin \
            --db-host=127.0.0.1 \
            --branch ${{ matrix.moodle-branch }}
        env:
          DB: ${{ matrix.database }}
          MOODLE_BEHAT_WWWROOT: http://localhost:8000

      - name: PHP lint
        run: moodle-plugin-ci phplint

      - name: Moodle coding standards
        run: moodle-plugin-ci codechecker --max-warnings 0

      - name: PHPDoc checker
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validate plugin structure
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        run: moodle-plugin-ci savepoints

      - name: Mustache template lint
        run: moodle-plugin-ci mustache

      - name: Grunt (AMD / SCSS)
        run: moodle-plugin-ci grunt

      - name: PHPUnit tests
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Behat acceptance tests
        run: |
          php -S localhost:8000 -t moodle &
          moodle-plugin-ci behat \
            --tags="@qtype_dermoscopysim" \
            --auto-rerun 3
