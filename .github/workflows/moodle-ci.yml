name: Moodle CI

# Runs the shared Moodle plugin CI: see https://github.com/verzog/moodle-ci-workflows.
# Its default matrix is Moodle 5.1 to 5.3 LTS (PostgreSQL 17 and MariaDB 11) plus Moodle main, which is allowed to
# fail. MOODLE_500_STABLE is deliberately excluded: it is below the 5.1 baseline in version.php. Its Grunt step runs on
# MOODLE_501_STABLE, the branch amd/build is made on.
# Run on pull requests, and on pushes to main and tags only. A plain "[push, pull_request]" runs the whole matrix
# twice for every push to a PR branch (once per event).
on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: verzog/moodle-ci-workflows/.github/workflows/moodle-plugin-ci.yml@v1
